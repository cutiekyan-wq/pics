<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Enchanted Memory Reveal</title>
  <style>
    :root {
      --bg1: #090b1a;
      --bg2: #1a1233;
      --bg3: #24163a;
      --glass: rgba(255,255,255,0.10);
      --text: #fef7ff;
      --muted: rgba(255,255,255,0.72);
      --gold: #f9d976;
      --gold-strong: #ffb703;
      --purple: #b794ff;
      --pink: #ff7ad9;
      --sky: #8be9fd;
      --yes: #35d4a5;
      --yes-dark: #12a26d;
      --no: #f88383;
      --no-dark: #d43a5c;
      --shadow: rgba(10, 9, 20, 0.68);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(185, 143, 255, 0.22), transparent 18%),
        radial-gradient(circle at 80% 0%, rgba(125, 211, 252, 0.25), transparent 18%),
        radial-gradient(circle at 50% 80%, rgba(255, 122, 217, 0.20), transparent 25%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 42%, var(--bg3) 100%);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: -15%;
      pointer-events: none;
      background-repeat: repeat;
      opacity: 0.7;
    }

    body::before {
      background-image:
        radial-gradient(circle at 20% 25%, rgba(255,255,255,0.8) 0 1.4px, transparent 2px),
        radial-gradient(circle at 68% 18%, rgba(255,255,255,0.7) 0 1.3px, transparent 2px),
        radial-gradient(circle at 82% 62%, rgba(255,255,255,0.9) 0 1.5px, transparent 2px),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,0.75) 0 1.4px, transparent 2px),
        radial-gradient(circle at 60% 40%, rgba(255,255,255,0.8) 0 1.2px, transparent 2px),
        radial-gradient(circle at 47% 72%, rgba(255,255,255,0.7) 0 1.3px, transparent 2px);
      animation: drift 18s linear infinite;
    }

    body::after {
      inset: 6% 0 auto 0;
      height: 70%;
      background: radial-gradient(circle at center, rgba(160, 138, 255, 0.12), transparent 60%);
      animation: glow 10s ease-in-out infinite alternate;
    }

    .app {
      position: relative;
      width: min(92vw, 430px);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .banner {
      position: relative;
      padding: 12px 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(249,217,118,0.96), rgba(255,183,3,0.9), rgba(255,122,217,0.9));
      color: #2d1a00;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.7rem;
      box-shadow: 0 12px 30px rgba(249, 217, 118, 0.30), inset 0 0 15px rgba(255,255,255,0.25);
      animation: pulse 1.8s ease-in-out infinite, floatIn 0.8s ease-out;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.24);
    }

    .banner::before {
      content: "✦";
      margin-right: 8px;
      display: inline-block;
      animation: twinkle 1.3s ease-in-out infinite alternate;
    }

    .choice-row {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 18px;
      min-height: 56px;
      gap: 18px;
    }

    .choice-btn {
      border: none;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 24px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.18s ease, box-shadow 0.2s ease, filter 0.2s ease;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .choice-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
      pointer-events: none;
    }

    .choice-btn:active { transform: scale(0.97); }

    .yes-btn {
      background: linear-gradient(135deg, var(--yes), var(--yes-dark));
      color: white;
      box-shadow: 0 12px 26px rgba(52, 211, 153, 0.32);
    }

    .no-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, var(--no), var(--no-dark));
      color: white;
      box-shadow: 0 12px 24px rgba(248, 113, 113, 0.28);
      transition: left 0.18s ease, top 0.18s ease, transform 0.18s ease;
    }

    .gallery {
      width: min(92vw, 420px);
      aspect-ratio: 4 / 5;
      border-radius: 28px;
      background: rgba(18, 13, 28, 0.5);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05), 0 0 40px rgba(161, 122, 255, 0.08);
      position: relative;
      overflow: hidden;
      margin-top: 18px;
      opacity: 0;
      transform: translateY(18px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .gallery.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .gallery::before,
    .gallery::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .gallery::after {
      inset: auto 18px 18px 18px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.18), rgba(255,255,255,0));
      filter: blur(14px);
    }

    .collage {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      padding: 14px;
      background:
        linear-gradient(180deg, rgba(25, 14, 36, 0.42), rgba(11, 11, 22, 0.58)),
        radial-gradient(circle at top, rgba(183, 148, 255, 0.18), transparent 38%);
    }

    .tile {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.12), 0 10px 18px rgba(0,0,0,0.15), 0 0 18px rgba(249,217,118,0.12);
      background: #1a1a2d;
      animation: popIn 0.6s ease both;
      transform-origin: center;
    }

    .tile:nth-child(1) { animation-delay: 0.05s; }
    .tile:nth-child(2) { animation-delay: 0.1s; }
    .tile:nth-child(3) { animation-delay: 0.15s; }
    .tile:nth-child(4) { animation-delay: 0.2s; }
    .tile:nth-child(5) { animation-delay: 0.25s; }
    .tile:nth-child(6) { animation-delay: 0.3s; }
    .tile:nth-child(7) { animation-delay: 0.35s; }
    .tile:nth-child(8) { animation-delay: 0.4s; }
    .tile:nth-child(9) { animation-delay: 0.45s; }

    .tile img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(1.18) contrast(1.05) brightness(0.9) sepia(0.08) hue-rotate(4deg);
      transform: scale(1.05);
      transition: transform 0.5s ease, filter 0.5s ease;
    }

    .tile:hover img {
      transform: scale(1.12);
      filter: saturate(1.4) contrast(1.08) brightness(1) sepia(0.08) hue-rotate(4deg);
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(17, 8, 29, 0.18));
      pointer-events: none;
    }

    .tile:nth-child(1) { grid-column: 1 / span 2; grid-row: 1; }
    .tile:nth-child(2) { grid-column: 3; grid-row: 1; }
    .tile:nth-child(3) { grid-column: 1; grid-row: 2; }
    .tile:nth-child(4) { grid-column: 2 / span 2; grid-row: 2; }
    .tile:nth-child(5) { grid-column: 1; grid-row: 3; }
    .tile:nth-child(6) { grid-column: 2; grid-row: 3; }
    .tile:nth-child(7) { grid-column: 3; grid-row: 3; }
    .tile:nth-child(8) { grid-column: 1 / span 2; grid-row: 3; }
    .tile:nth-child(9) { grid-column: 3; grid-row: 2; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes twinkle {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.2) rotate(12deg); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes drift {
      0% { transform: translateY(0); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0); }
    }

    @keyframes glow {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 0.9; transform: scale(1.08); }
    }

    @media (max-width: 420px) {
      .choice-row { margin-top: 16px; }
      .choice-btn { padding: 11px 18px; font-size: 0.74rem; }
      .banner { font-size: 0.64rem; padding: 10px 16px; }
      .no-btn { right: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="banner">Would you like to see a surprise?</div>

    <div class="choice-row">
      <button class="choice-btn yes-btn" type="button">Yes</button>
      <button class="choice-btn no-btn" type="button">No</button>
    </div>

    <div class="gallery" id="gallery" aria-label="Fantasy photo collage">
      <div class="collage" id="collage"></div>
    </div>
  </div>

  <script>
    const images = [
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_1025EE72-0018-46D6-BD02-2FC395C3A0DC.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_47F44A8D-59E8-47D5-A5FC-A5EFB5AFA665.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_650F51BD-7C14-4D21-ACCC-C2C24B0A0D22.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_7EC56514-F4C7-4C1C-9C75-DCCF43DBB28D.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_8156417C-996F-410B-8FC0-C9D8B77C9616.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_890B36E7-4CC2-471B-8830-E41C24501460.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_A1CDCD72-DCAC-4081-91BE-5E31A524A5A8.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_AA2718BD-1545-41AB-BF5F-892361F24BEA.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_BA30A766-76FC-4097-9DF1-306B222FA299.png'
    ];

    const gallery = document.getElementById('gallery');
    const collage = document.getElementById('collage');
    const yesBtn = document.querySelector('.yes-btn');
    const noBtn = document.querySelector('.no-btn');
    const choiceRow = document.querySelector('.choice-row');

    const audioState = {
      context: null,
      master: null,
      loopId: null
    };

    function ensureAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!audioState.context) {
        audioState.context = new AudioCtx();
        audioState.master = audioState.context.createGain();
        audioState.master.gain.value = 0.18;
        audioState.master.connect(audioState.context.destination);
      }
      if (audioState.context.state === 'suspended') {
        audioState.context.resume();
      }
      return audioState.context;
    }

    function playTone({ freq = 440, duration = 0.45, type = 'sine', volume = 0.05, start = 0, sweep = 0, attack = 0.01, decay = 0.2 }) {
      const ctx = ensureAudio();
      if (!ctx || !audioState.master) return;

      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime + start;

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, now);
      if (sweep !== 0) {
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, freq + sweep), now + duration);
      }

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + decay);

      oscillator.connect(gain);
      gain.connect(audioState.master);

      oscillator.start(now);
      oscillator.stop(now + duration + decay + 0.05);
    }

    function playMagicSequence(notes, delay = 180) {
      notes.forEach((note, index) => {
        setTimeout(() => {
          playTone({
            freq: note,
            duration: 0.42,
            type: 'triangle',
            volume: 0.05,
            sweep: 70,
            attack: 0.02,
            decay: 0.28
          });
        }, index * delay);
      });
    }

    function startFantasyMusic() {
      const ctx = ensureAudio();
      if (!ctx || audioState.loopId) return;

      const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 392.00, 523.25, 659.25];
      let step = 0;

      audioState.loopId = setInterval(() => {
        const freq = melody[step % melody.length];
        playTone({ freq, duration: 0.8, type: 'triangle', volume: 0.04, sweep: 80, attack: 0.02, decay: 0.35 });
        playTone({ freq: freq / 2, duration: 0.9, type: 'sine', volume: 0.018, sweep: 40, attack: 0.02, decay: 0.42 });

        if (step % 3 === 0) {
          playTone({ freq: freq * 2, duration: 0.55, type: 'sine', volume: 0.018, sweep: 80, attack: 0.01, decay: 0.22 });
        }

        step += 1;
      }, 520);
    }

    function stopFantasyMusic() {
      if (audioState.loopId) {
        clearInterval(audioState.loopId);
        audioState.loopId = null;
      }
    }

    function preloadImages() {
      images.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    }

    function buildCollage() {
      collage.innerHTML = images.map((src) => `
        <div class="tile">
          <img src="${src}" alt="Enchanted memory" />
        </div>
      `).join('');
    }

    function moveNoButton() {
      const rowWidth = choiceRow.clientWidth;
      const maxX = Math.max(0, rowWidth - 110);
      const rndX = Math.random() * maxX;
      const rndY = Math.random() * 18;

      noBtn.style.left = `${rndX}px`;
      noBtn.style.top = `${50 + rndY}px`;
      noBtn.style.transform = 'translateY(0)';
    }

    noBtn.addEventListener('pointerenter', () => {
      ensureAudio();
      playTone({ freq: 170, duration: 0.12, type: 'sawtooth', volume: 0.03, sweep: -90, attack: 0.008, decay: 0.12 });
      moveNoButton();
    });

    noBtn.addEventListener('pointerdown', () => {
      ensureAudio();
      playTone({ freq: 150, duration: 0.15, type: 'square', volume: 0.025, sweep: -80, attack: 0.01, decay: 0.15 });
      moveNoButton();
    });

    noBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      ensureAudio();
      playTone({ freq: 150, duration: 0.15, type: 'square', volume: 0.025, sweep: -80, attack: 0.01, decay: 0.15 });
      moveNoButton();
    }, { passive: false });

    yesBtn.addEventListener('click', () => {
      ensureAudio();
      playMagicSequence([392, 523.25, 659.25, 783.99], 160);
      playTone({ freq: 220, duration: 0.8, type: 'triangle', volume: 0.06, sweep: 160, attack: 0.02, decay: 0.5 });
      playTone({ freq: 330, duration: 0.9, type: 'sine', volume: 0.04, sweep: 180, attack: 0.01, decay: 0.7 });
      startFantasyMusic();

      setTimeout(() => {
        gallery.classList.add('visible');
      }, 250);

      choiceRow.style.display = 'none';
      yesBtn.style.display = 'none';
      noBtn.style.display = 'none';
      document.querySelector('.banner').textContent = 'A magical memory revealed';
    });

    window.addEventListener('resize', moveNoButton);
    preloadImages();
    buildCollage();
    moveNoButton();
  </script>
</body>
</html>
