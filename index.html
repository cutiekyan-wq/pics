<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Enchanted Memory Reveal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');

    :root {
      --bg1: #edf9ff;
      --bg2: #e0f1ff;
      --bg3: #f9fdff;
      --cloud-1: rgba(255,255,255,0.96);
      --cloud-2: rgba(220,235,255,0.78);
      --cloud-3: rgba(188,214,255,0.42);
      --glass: rgba(255,255,255,0.18);
      --glass-strong: rgba(255,255,255,0.28);
      --ink: #2d4057;
      --rose: #f6bfd1;
      --lavender: #d8c6ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.98), transparent 18%),
        radial-gradient(circle at 78% 12%, rgba(185, 217, 255, 0.82), transparent 22%),
        radial-gradient(circle at 58% 70%, rgba(255,255,255,0.78), transparent 24%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 42%, var(--bg3) 100%);
      color: white;
      overflow: hidden;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: -16% -8%;
      pointer-events: none;
      z-index: -2;
      background-repeat: no-repeat;
    }

    body::before {
      background:
        radial-gradient(ellipse at 12% 24%, var(--cloud-1) 0 11%, transparent 18%),
        radial-gradient(ellipse at 24% 34%, rgba(255,255,255,0.94) 0 11%, transparent 19%),
        radial-gradient(ellipse at 38% 22%, rgba(255,255,255,0.98) 0 12%, transparent 20%),
        radial-gradient(ellipse at 50% 31%, rgba(255,255,255,0.92) 0 13%, transparent 22%),
        radial-gradient(ellipse at 60% 17%, rgba(255,255,255,0.96) 0 11%, transparent 19%),
        radial-gradient(ellipse at 72% 28%, rgba(255,255,255,0.94) 0 12%, transparent 20%),
        radial-gradient(ellipse at 84% 24%, rgba(255,255,255,0.97) 0 10%, transparent 18%),
        radial-gradient(ellipse at 52% 72%, rgba(255,255,255,0.82) 0 14%, transparent 21%),
        radial-gradient(ellipse at 68% 82%, rgba(255,255,255,0.78) 0 11%, transparent 18%);
      filter: blur(12px) saturate(1.15);
      opacity: 0.98;
      animation: cloudDrift 30s ease-in-out infinite alternate;
    }

    body::after {
      inset: 6% 0 auto 0;
      height: 72%;
      background:
        radial-gradient(circle at 50% 18%, rgba(211,233,255,0.78), transparent 17%),
        radial-gradient(circle at 60% 30%, rgba(178,214,255,0.52), transparent 19%),
        radial-gradient(circle at 42% 32%, rgba(236,246,255,0.5), transparent 25%),
        radial-gradient(circle at center, rgba(190,227,255,0.34), transparent 57%);
      filter: blur(14px);
      opacity: 0.96;
      animation: softGlow 14s ease-in-out infinite alternate;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .sparkle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.42) 36%, transparent 72%);
      box-shadow: 0 0 14px rgba(255,255,255,0.9);
      opacity: 0.78;
      animation: twinkle 3.8s ease-in-out infinite alternate;
    }

    .floating-emoji-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .floating-emoji {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: clamp(1.4rem, 3vw, 2.6rem);
      filter: drop-shadow(0 5px 10px rgba(255, 150, 180, 0.55));
      animation: floatEmoji 8s ease-in-out infinite alternate;
      opacity: 0.9;
      user-select: none;
    }

    .burst {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      animation: burstOut 1.2s ease-out forwards;
    }

    .app {
      position: relative;
      width: min(92vw, 430px);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .banner {
      position: relative;
      padding: 12px 22px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(218,232,255,0.9), rgba(236,244,255,0.9), rgba(198,220,255,0.95));
      color: var(--ink);
      font-weight: 900;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      font-size: 0.72rem;
      box-shadow: 0 14px 32px rgba(170, 190, 255, 0.26), inset 0 0 18px rgba(255,255,255,0.5), 0 0 26px rgba(177, 170, 255, 0.18);
      animation: pulse 1.8s ease-in-out infinite, floatIn 0.8s ease-out;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.58);
      text-shadow: 0 1px 0 rgba(255,255,255,0.42);
    }

    .banner::before,
    .banner::after {
      content: "✦";
      display: inline-block;
      animation: twinkle 1.4s ease-in-out infinite alternate;
      margin: 0 8px;
      font-size: 0.82rem;
    }

    .choice-row {
      position: relative;
      width: min(100%, 260px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 18px;
      min-height: 64px;
      gap: 12px;
      z-index: 4;
      overflow: visible;
    }

    .choice-btn {
      border: none;
      position: relative;
      z-index: 1;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 13px 26px 14px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.72);
      outline: none;
      transition: transform 0.18s ease, box-shadow 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      box-shadow: 0 12px 20px rgba(110, 140, 200, 0.12), inset 0 1px 0 rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.12);
      border-radius: 54% 46% 52% 48% / 58% 42% 58% 42%;
      isolation: isolate;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(90, 96, 150, 0.35), 0 0 10px rgba(255,255,255,0.2);
    }

    .choice-btn::before,
    .choice-btn::after {
      content: "";
      position: absolute;
      bottom: 12%;
      width: 38%;
      height: 72%;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      box-shadow: inset 0 0 18px rgba(255,255,255,0.28);
      z-index: 0;
    }

    .choice-btn::before { left: 10%; }
    .choice-btn::after { right: 10%; }

    .choice-btn > * { position: relative; z-index: 1; }

    .choice-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .choice-btn:focus-visible {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.35), 0 0 22px rgba(255,255,255,0.2);
    }

    .choice-btn:active {
      transform: scale(0.97);
    }

    .yes-btn {
      background: linear-gradient(135deg, rgba(174, 222, 255, 0.45), rgba(255,255,255,0.22));
      color: #ffffff;
      box-shadow: 0 12px 26px rgba(104, 154, 196, 0.22), inset 0 1px 0 rgba(255,255,255,0.8), 0 0 18px rgba(160, 214, 255, 0.18);
      min-width: 110px;
    }

    .yes-btn::after {
      content: "";
      position: absolute;
      inset: -30%;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 55%);
      transform: scale(0.8);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .yes-btn:hover::after {
      opacity: 1;
      transform: scale(1.1);
    }

    .no-btn {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1);
      background: linear-gradient(135deg, rgba(189, 223, 255, 0.44), rgba(255,255,255,0.22));
      color: #ffffff;
      box-shadow: 0 12px 24px rgba(160, 186, 234, 0.2), inset 0 1px 0 rgba(255,255,255,0.72);
      transition: left 0.18s ease, top 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease, opacity 0.2s ease;
      z-index: 30;
      min-width: 110px;
      min-height: 46px;
      padding: 12px 22px;
      font-size: 0.9rem;
    }

    .gallery {
      width: min(92vw, 420px);
      aspect-ratio: 4 / 5;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
      border: 1px solid rgba(255,255,255,0.24);
      box-shadow: 0 24px 60px rgba(68, 46, 82, 0.18), inset 0 0 0 1px rgba(255,255,255,0.1), 0 0 44px rgba(161, 122, 255, 0.08);
      position: relative;
      overflow: hidden;
      margin-top: 18px;
      opacity: 0;
      transform: translateY(22px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease, box-shadow 0.8s ease;
      backdrop-filter: blur(18px) saturate(1.14);
      -webkit-backdrop-filter: blur(18px) saturate(1.14);
    }

    .gallery.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      box-shadow: 0 30px 66px rgba(102, 81, 111, 0.18), inset 0 0 0 1px rgba(255,255,255,0.14), 0 0 60px rgba(159, 205, 255, 0.08);
    }

    .gallery::before,
    .gallery::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: none;
    }

    .gallery::before {
      inset: 18px;
      border-color: rgba(255,255,255,0.1);
      box-shadow: inset 0 0 30px rgba(255,255,255,0.04);
    }

    .gallery::after {
      inset: auto 18px 18px 18px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.18), rgba(255,255,255,0));
      filter: blur(16px);
    }

    .collage {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      padding: 14px;
      background:
        linear-gradient(180deg, rgba(25, 14, 36, 0.1), rgba(11, 11, 22, 0.24)),
        radial-gradient(circle at top, rgba(183, 148, 255, 0.08), transparent 38%);
      perspective: 1200px;
    }

    .tile {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.08), 0 10px 18px rgba(0,0,0,0.08), 0 0 18px rgba(170, 209, 255, 0.08);
      background: #1a1a2d;
      animation: popIn 0.65s ease both;
      transform-origin: center;
      isolation: isolate;
      will-change: transform;
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.12), transparent 24%, transparent 72%, rgba(255,255,255,0.08));
      pointer-events: none;
      z-index: 1;
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: -24% -8%;
      background: conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,0.08), rgba(255,255,255,0), rgba(184,148,255,0.12), rgba(255,255,255,0));
      transform: rotate(18deg) scale(1.2);
      opacity: 0;
      animation: shimmer 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }

    .tile:nth-child(1) { animation-delay: 0.05s; }
    .tile:nth-child(2) { animation-delay: 0.1s; }
    .tile:nth-child(3) { animation-delay: 0.15s; }
    .tile:nth-child(4) { animation-delay: 0.2s; }
    .tile:nth-child(5) { animation-delay: 0.25s; }
    .tile:nth-child(6) { animation-delay: 0.3s; }
    .tile:nth-child(7) { animation-delay: 0.35s; }
    .tile:nth-child(8) { animation-delay: 0.4s; }
    .tile:nth-child(9) { animation-delay: 0.45s; }

    .tile img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(1.25) contrast(1.06) brightness(0.92) sepia(0.08) hue-rotate(6deg);
      transform: scale(1.06) translate3d(var(--float-x, 0px), var(--float-y, 0px), 0) rotate(var(--float-rot, 0deg));
      transform-origin: center;
      transition: transform 0.5s ease, filter 0.5s ease;
      animation: photoFloat var(--float-duration, 9s) ease-in-out infinite alternate;
      animation-delay: var(--float-delay, 0s);
      will-change: transform, filter;
    }

    .tile:hover img {
      transform: scale(1.12) rotate(0deg);
      filter: saturate(1.4) contrast(1.12) brightness(1) sepia(0.08) hue-rotate(6deg);
    }

    .tile:nth-child(1) { grid-column: 1 / span 2; grid-row: 1; }
    .tile:nth-child(2) { grid-column: 3; grid-row: 1; }
    .tile:nth-child(3) { grid-column: 1; grid-row: 2; }
    .tile:nth-child(4) { grid-column: 2 / span 2; grid-row: 2; }
    .tile:nth-child(5) { grid-column: 1; grid-row: 3; }
    .tile:nth-child(6) { grid-column: 2; grid-row: 3; }
    .tile:nth-child(7) { grid-column: 3; grid-row: 3; }
    .tile:nth-child(8) { grid-column: 1 / span 2; grid-row: 3; }
    .tile:nth-child(9) { grid-column: 3; grid-row: 2; }

    .letter-card {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.96);
      width: min(82%, 300px);
      padding: 18px 16px 16px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(233,245,255,0.76));
      border: 1px solid rgba(255,255,255,0.58);
      box-shadow: 0 20px 35px rgba(34, 18, 40, 0.16), 0 0 30px rgba(177, 206, 255, 0.12), inset 0 0 18px rgba(255,255,255,0.66);
      color: #532d3d;
      text-align: center;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease, transform 0.7s ease;
      font-family: 'Cormorant Garamond', Georgia, serif;
      backdrop-filter: blur(10px);
    }

    .gallery.visible .letter-card {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .letter-card::before {
      content: "✉";
      display: block;
      font-size: 1.9rem;
      margin-bottom: 8px;
      color: #d9617a;
      filter: drop-shadow(0 4px 8px rgba(217, 97, 122, 0.25));
      font-family: Arial, sans-serif;
    }

    .letter-title {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 3vw, 1.95rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #6d2c3b;
      line-height: 1.1;
      font-family: 'Great Vibes', 'Brush Script MT', cursive;
      text-shadow: 0 1px 0 rgba(255,255,255,0.36);
      transform: rotate(-1deg);
    }

    .letter-text {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.7;
      color: #5f2a3d;
      font-weight: 600;
      font-family: 'Cormorant Garamond', Georgia, serif;
      letter-spacing: 0.02em;
      text-shadow: 0 0.5px 0 rgba(255,255,255,0.3);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes twinkle {
      0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
      100% { transform: scale(1.2) rotate(12deg); opacity: 1; }
    }

    @keyframes cloudDrift {
      0% { transform: translateX(-30px) translateY(0px) scale(1); }
      50% { transform: translateX(18px) translateY(12px) scale(1.04); }
      100% { transform: translateX(8px) translateY(-6px) scale(1.08); }
    }

    @keyframes softGlow {
      0% { opacity: 0.72; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.12); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes photoFloat {
      0% {
        transform: scale(1.04) translate3d(var(--float-x, 0px), var(--float-y, 0px), 0) rotate(calc(var(--float-rot, 0deg) * -0.8));
      }
      50% {
        transform: scale(1.09) translate3d(calc(var(--float-x, 0px) * -0.3), calc(var(--float-y, 0px) * -0.4), 8px) rotate(0.5deg);
      }
      100% {
        transform: scale(1.08) translate3d(calc(var(--float-x, 0px) * 0.9), calc(var(--float-y, 0px) * 0.9), 4px) rotate(var(--float-rot, 0deg));
      }
    }

    @keyframes floatEmoji {
      0% {
        transform: translate3d(0, 0, 0) scale(0.9) rotate(0deg);
        opacity: 0.3;
      }
      25% {
        transform: translate3d(25px, -22px, 0) scale(1.1) rotate(14deg);
        opacity: 0.9;
      }
      50% {
        transform: translate3d(-18px, -38px, 0) scale(1.25) rotate(-12deg);
        opacity: 1;
      }
      75% {
        transform: translate3d(30px, -62px, 0) scale(1.1) rotate(18deg);
        opacity: 0.8;
      }
      100% {
        transform: translate3d(-15px, -90px, 0) scale(0.9) rotate(-18deg);
        opacity: 0.2;
      }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0; transform: rotate(18deg) scale(1.2); }
      30% { opacity: 0.28; }
      50% { opacity: 0.45; }
      70% { opacity: 0.22; }
    }

    @keyframes burstOut {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.3);
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1.2);
      }
    }

    @media (max-width: 420px) {
      .choice-row { margin-top: 16px; }
      .choice-btn { padding: 11px 18px; font-size: 0.84rem; }
      .banner { font-size: 0.64rem; padding: 10px 16px; }
      .no-btn { right: 8px; }
      .letter-card { width: min(86%, 280px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true"></div>
  <div class="floating-emoji-layer" id="floatingEmojiLayer" aria-hidden="true"></div>

  <div class="app">
    <div class="banner">Would you like to see a surprise?</div>

    <div class="choice-row">
      <button class="choice-btn yes-btn" type="button">Yes</button>
      <button class="choice-btn no-btn" type="button">No</button>
    </div>

    <div class="gallery" id="gallery" aria-label="Fantasy photo collage">
      <div class="collage" id="collage"></div>
      <div class="letter-card" aria-live="polite">
        <h2 class="letter-title">Good morning, my honey bunch</h2>
        <p class="letter-text">May your day bloom with love, warmth, and endless smiles. You are my favorite part of every morning.</p>
      </div>
    </div>
  </div>

  <audio id="loveSong" src="song.mp3" preload="auto" loop></audio>

  <script>
    const images = [
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_1025EE72-0018-46D6-BD02-2FC395C3A0DC.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_47F44A8D-59E8-47D5-A5FC-A5EFB5AFA665.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_650F51BD-7C14-4D21-ACCC-C2C24B0A0D22.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_7EC56514-F4C7-4C1C-9C75-DCCF43DBB28D.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_8156417C-996F-410B-8FC0-C9D8B77C9616.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_890B36E7-4CC2-471B-8830-E41C24501460.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_A1CDCD72-DCAC-4081-91BE-5E31A524A5A8.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_AA2718BD-1545-41AB-BF5F-892361F24BEA.png',
      'https://raw.githubusercontent.com/cutiekyan-wq/pics/main/Messenger_creation_BA30A766-76FC-4097-9DF1-306B222FA299.png'
    ];

    const gallery = document.getElementById('gallery');
    const collage = document.getElementById('collage');
    const yesBtn = document.querySelector('.yes-btn');
    const noBtn = document.querySelector('.no-btn');
    const choiceRow = document.querySelector('.choice-row');
    const sparkles = document.querySelector('.sparkles');
    const floatingEmojiLayer = document.getElementById('floatingEmojiLayer');
    const loveSong = document.getElementById('loveSong');

    const audioState = {
      context: null,
      master: null,
      loopId: null
    };

    let noButtonScale = 1;

    function stopFantasyMusic() {
      if (audioState.loopId) {
        clearInterval(audioState.loopId);
        audioState.loopId = null;
      }
    }

    function pauseAudio() {
      stopFantasyMusic();
      if (loveSong) {
        loveSong.pause();
      }
    }

    function startLoveSong() {
      if (!loveSong) return;
      loveSong.volume = 0.5;
      loveSong.currentTime = 0;
      loveSong.play().catch(() => {});
    }

    function createSparkles() {
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < 34; i += 1) {
        const dot = document.createElement('span');
        dot.className = 'sparkle';
        const left = Math.random() * 100;
        const top = Math.random() * 100;
        const size = (Math.random() * 5 + 3).toFixed(2);
        const delay = (Math.random() * 3).toFixed(2);
        const duration = (Math.random() * 3 + 2.5).toFixed(2);
        dot.style.left = `${left}%`;
        dot.style.top = `${top}%`;
        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.animationDelay = `${delay}s`;
        dot.style.animationDuration = `${duration}s`;
        dot.style.opacity = (Math.random() * 0.6 + 0.3).toFixed(2);
        fragment.appendChild(dot);
      }
      sparkles.appendChild(fragment);
    }

    function createFloatingEmojis() {
      for (let i = 0; i < 12; i += 1) {
        const emoji = document.createElement('div');
        emoji.className = 'floating-emoji';
        emoji.textContent = '😍';

        const startX = 8 + Math.random() * 84;
        const startY = 16 + Math.random() * 68;
        const size = 18 + Math.random() * 26;
        const duration = 6 + Math.random() * 7;
        const delay = Math.random() * 5;

        emoji.style.left = `${startX}%`;
        emoji.style.top = `${startY}%`;
        emoji.style.fontSize = `${size}px`;
        emoji.style.animationDuration = `${duration}s`;
        emoji.style.animationDelay = `${delay}s`;
        floatingEmojiLayer.appendChild(emoji);
      }
    }

    function createBurst(x, y) {
      for (let i = 0; i < 16; i += 1) {
        const particle = document.createElement('span');
        particle.className = 'burst';
        const angle = (Math.PI * 2 * i) / 16;
        const distance = 40 + Math.random() * 50;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.background = `hsl(${Math.random() * 60 + 300}, 100%, 75%)`;
        particle.style.setProperty('--x', `${dx}px`);
        particle.style.setProperty('--y', `${dy}px`);
        particle.style.animationDelay = `${Math.random() * 0.08}s`;
        sparkles.appendChild(particle);
        setTimeout(() => particle.remove(), 1200);
      }
    }

    function ensureAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!audioState.context) {
        audioState.context = new AudioCtx();
        audioState.master = audioState.context.createGain();
        audioState.master.gain.value = 0.18;
        audioState.master.connect(audioState.context.destination);
      }
      if (audioState.context.state === 'suspended') {
        audioState.context.resume();
      }
      return audioState.context;
    }

    function playTone({ freq = 440, duration = 0.45, type = 'sine', volume = 0.05, start = 0, sweep = 0, attack = 0.01, decay = 0.2 }) {
      const ctx = ensureAudio();
      if (!ctx || !audioState.master) return;

      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime + start;

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, now);
      if (sweep !== 0) {
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, freq + sweep), now + duration);
      }

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + decay);

      oscillator.connect(gain);
      gain.connect(audioState.master);

      oscillator.start(now);
      oscillator.stop(now + duration + decay + 0.05);
    }

    function playMagicSequence(notes, delay = 180) {
      notes.forEach((note, index) => {
        setTimeout(() => {
          playTone({
            freq: note,
            duration: 0.42,
            type: 'triangle',
            volume: 0.06,
            sweep: 70,
            attack: 0.02,
            decay: 0.28
          });
        }, index * delay);
      });
    }

    function playYesTheme() {
      const melody = [392, 523.25, 659.25, 783.99, 659.25, 523.25, 392, 440, 523.25, 659.25, 783.99, 659.25];
      melody.forEach((note, index) => {
        setTimeout(() => {
          playTone({
            freq: note,
            duration: 0.34,
            type: 'triangle',
            volume: 0.06,
            sweep: 90,
            attack: 0.02,
            decay: 0.16
          });
          if (index % 2 === 0) {
            playTone({
              freq: note / 2,
              duration: 0.42,
              type: 'sine',
              volume: 0.03,
              sweep: 60,
              attack: 0.01,
              decay: 0.24
            });
          }
        }, index * 150);
      });
    }

    function startFantasyMusic() {
      const ctx = ensureAudio();
      if (!ctx || audioState.loopId) return;

      const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 392.00, 523.25, 659.25];
      let step = 0;

      audioState.loopId = setInterval(() => {
        const freq = melody[step % melody.length];
        playTone({ freq, duration: 0.8, type: 'triangle', volume: 0.04, sweep: 80, attack: 0.02, decay: 0.35 });
        playTone({ freq: freq / 2, duration: 0.9, type: 'sine', volume: 0.018, sweep: 40, attack: 0.02, decay: 0.42 });

        if (step % 3 === 0) {
          playTone({ freq: freq * 2, duration: 0.55, type: 'sine', volume: 0.018, sweep: 80, attack: 0.01, decay: 0.22 });
        }

        step += 1;
      }, 520);
    }

    function preloadImages() {
      images.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    }

    function buildCollage() {
      collage.innerHTML = images.map((src) => {
        const movementX = ((Math.random() * 10) - 5).toFixed(2);
        const movementY = ((Math.random() * 10) - 5).toFixed(2);
        const rotation = ((Math.random() * 6) - 3).toFixed(2);
        const duration = (8 + Math.random() * 6).toFixed(2);
        const delay = (Math.random() * 2.8).toFixed(2);

        return `
          <div class="tile" style="--float-x:${movementX}px; --float-y:${movementY}px; --float-rot:${rotation}deg; --float-duration:${duration}s; --float-delay:${delay}s;">
            <img src="${src}" alt="Enchanted memory" />
          </div>
        `;
      }).join('');
    }

    function placeNoButtonUnderYes() {
      const buttonWidth = noBtn.offsetWidth || 110;
      const buttonHeight = noBtn.offsetHeight || 42;
      const yesRect = yesBtn.getBoundingClientRect();
      const maxX = Math.max(16, window.innerWidth - buttonWidth - 16);
      const maxY = Math.max(16, window.innerHeight - buttonHeight - 16);
      const nextX = Math.min(Math.max(16, yesRect.left + (yesRect.width - buttonWidth) / 2), maxX);
      const nextY = Math.min(Math.max(16, yesRect.bottom + 12), maxY);

      noBtn.style.left = `${nextX}px`;
      noBtn.style.top = `${nextY}px`;
      noBtn.style.transform = `scale(${noButtonScale})`;
    }

    function moveNoButton() {
      const buttonWidth = noBtn.offsetWidth || 110;
      const buttonHeight = noBtn.offsetHeight || 42;
      const maxX = Math.max(16, window.innerWidth - buttonWidth - 16);
      const maxY = Math.max(16, window.innerHeight - buttonHeight - 16);
      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
      noBtn.style.transform = `scale(${noButtonScale})`;
    }

    function shrinkNoButton() {
      noButtonScale = Math.max(0.38, noButtonScale * 0.82);
      moveNoButton();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        pauseAudio();
      }
    });

    window.addEventListener('pagehide', pauseAudio);
    window.addEventListener('beforeunload', pauseAudio);

    noBtn.addEventListener('pointerenter', () => {
      ensureAudio();
      playTone({ freq: 170, duration: 0.12, type: 'sawtooth', volume: 0.03, sweep: -90, attack: 0.008, decay: 0.12 });
      shrinkNoButton();
    });

    noBtn.addEventListener('pointerdown', () => {
      ensureAudio();
      playTone({ freq: 150, duration: 0.15, type: 'square', volume: 0.025, sweep: -80, attack: 0.01, decay: 0.15 });
      shrinkNoButton();
    });

    noBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      ensureAudio();
      playTone({ freq: 150, duration: 0.15, type: 'square', volume: 0.025, sweep: -80, attack: 0.01, decay: 0.15 });
      shrinkNoButton();
    }, { passive: false });

    yesBtn.addEventListener('click', () => {
      ensureAudio();
      startLoveSong();
      const buttonRect = yesBtn.getBoundingClientRect();
      const burstX = buttonRect.left + buttonRect.width / 2;
      const burstY = buttonRect.top + buttonRect.height / 2;
      createBurst(burstX - 30, burstY - 20);

      playYesTheme();
      playMagicSequence([392, 523.25, 659.25, 783.99], 160);
      playTone({ freq: 220, duration: 0.8, type: 'triangle', volume: 0.07, sweep: 160, attack: 0.02, decay: 0.5 });
      playTone({ freq: 330, duration: 0.9, type: 'sine', volume: 0.05, sweep: 180, attack: 0.01, decay: 0.7 });
      startFantasyMusic();

      setTimeout(() => {
        gallery.classList.add('visible');
      }, 250);

      choiceRow.style.display = 'none';
      yesBtn.style.display = 'none';
      noBtn.style.display = 'none';
      document.querySelector('.banner').textContent = 'Good morning, my honey bunch';
    });

    window.addEventListener('resize', () => {
      if (noBtn.style.display !== 'none') placeNoButtonUnderYes();
    });

    createSparkles();
    createFloatingEmojis();
    preloadImages();
    buildCollage();
    placeNoButtonUnderYes();
  </script>
</body>
</html>
